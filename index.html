<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Team Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#f7f8f6; --surface:#ffffff; --sunk:#eef1ef; --ink:#17222b; --muted:#5f6b73; --rule:#d9dfdc;
  --navy:#14324a; --navy-2:#1c4363; --on-navy:#f2f5f7; --on-navy-muted:#a9bccb;
  --marker:#f2c230; --marker-ink:#2b2200; --up:#23845a; --down:#bf3b2f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0f151a; --surface:#172028; --sunk:#1d2832; --ink:#e7ecef; --muted:#93a1ab; --rule:#2a3741;
    --navy:#112a3e; --navy-2:#183a56; --up:#4cc08a; --down:#f0786c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:32px 32px; background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

/* Header */
.top{background:var(--navy);color:var(--on-navy)}
.top-inner{max-width:1100px;margin:0 auto;padding:22px 20px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.01em;margin:0}
.brand p{margin:0;color:var(--on-navy-muted);font-size:14px}
nav{display:flex;gap:4px;margin-top:20px;overflow-x:auto}
nav button{
  background:transparent;border:0;color:var(--on-navy-muted);padding:10px 16px;font-weight:600;cursor:pointer;
  border-radius:8px 8px 0 0;white-space:nowrap
}
nav button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.demo{background:var(--marker);color:var(--marker-ink);text-align:center;font-size:13px;padding:6px 12px;font-weight:500}

main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
section[hidden]{display:none}
h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
select,input[type=date],input[type=text]{
  background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:40px
}

/* Team scoreboard (the one bold moment) */
.board{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:20px 22px;margin-bottom:22px}
.board-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.board-head strong{font-family:var(--display);font-size:22px;font-weight:600}
.board-head span{color:var(--on-navy-muted);font-size:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--navy-2);border-radius:10px;overflow:hidden}
.total{background:var(--navy);padding:14px 16px}
.total .lbl{color:var(--on-navy-muted);font-size:13px}
.total .num{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.05;font-variant-numeric:tabular-nums}
.board .delta.up{color:#7fe0ae}.board .delta.down{color:#ffa196}.board .delta.flat{color:var(--on-navy-muted)}

/* Tables */
.table-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:13px;font-weight:600;color:var(--muted);background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td.name{font-weight:600}
td .val{font-family:var(--display);font-size:24px;font-weight:600}
td.lead{background:var(--marker);color:var(--marker-ink)}
td.lead .delta{color:var(--marker-ink)}
td.missing{color:var(--muted);font-style:italic}
tr.inactive td.name{color:var(--muted)}
.delta{display:block;font-size:12px;font-weight:600}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--muted)}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:10px 2px 0}
.legend i{width:14px;height:14px;background:var(--marker);border-radius:3px;display:inline-block}
.stamp{color:var(--muted);font-size:12px;margin-top:18px}

/* History */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chart-box{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;height:320px;margin-bottom:22px}
.stack{display:grid;gap:22px}

/* Entry */
.entry-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:22px;align-items:start}
@media (max-width:820px){.entry-grid{grid-template-columns:1fr}}
.entry td input{width:92px;text-align:right;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--paper);font-variant-numeric:tabular-nums}
.entry td.status{font-size:12px;color:var(--muted)}
.week-pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.week-pick label{font-weight:600}
.week-note{color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{background:var(--navy);color:var(--on-navy);border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.55;cursor:wait}
.dirty{color:var(--down);font-size:13px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}
.roster{list-style:none;margin:14px 0 0;padding:0}
.roster li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.roster li.off span{color:var(--muted);text-decoration:line-through}
.link{background:none;border:0;color:var(--navy-2);font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline}
@media (prefers-color-scheme:dark){.link{color:#8fb8dc}}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:40px 20px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:var(--down);color:#fff}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:560px){.brand h1{font-size:32px}.total .num{font-size:46px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>Developer Team Tracker</h1>
      <p>SIG Austin weekly metrics, Monday through Friday</p>
    </div>
    <nav role="tablist">
      <button role="tab" data-tab="thisweek" aria-selected="true">This week</button>
      <button role="tab" data-tab="history" aria-selected="false">Week over week</button>
      <button role="tab" data-tab="entry" aria-selected="false">Enter data</button>
    </nav>
  </div>
</header>
<div class="demo" id="demoBar" hidden>Demo mode with sample numbers. Connect your Google Sheet by pasting its web app URL into API_URL in index.html.</div>

<main>
  <section id="thisweek"><p class="sub">Loading the latest numbers…</p></section>
  <section id="history" hidden></section>
  <section id="entry" hidden></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Settings ===== */
const API_URL = ''; // Paste your Apps Script web app URL (ends in /exec)

const DEMO = !API_URL;
const PALETTE = ['#2f6fa3','#e0a21b','#3a9a6b','#c0563b','#7b5ea7','#4fa3b5','#a0703e','#d0679b'];
let state = { metrics: [], agents: [], entries: [] };
let view = { tab: 'thisweek', week: null, who: '__team', metric: null, entryWeek: null };
let chart = null, dirty = false;

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoToDate = iso => { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); };
const dateToIso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function fridayOf(iso){
  const d = isoToDate(iso), day = d.getDay();
  d.setDate(d.getDate() + (day === 6 ? -1 : day === 0 ? -2 : 5 - day));
  return dateToIso(d);
}
const fmtWeek = (iso, short) => isoToDate(iso).toLocaleDateString('en-US',
  short ? { month:'short', day:'numeric' } : { weekday:'short', month:'short', day:'numeric', year:'numeric' });
function weekRange(iso){
  const f = isoToDate(iso), m = new Date(f); m.setDate(f.getDate() - 4);
  const o = { month:'short', day:'numeric' };
  return `${m.toLocaleDateString('en-US', o)} to ${f.toLocaleDateString('en-US', o)}`;
}
const shortLabel = m => m.short || m.label;
const weeks = () => [...new Set(state.entries.map(e => e.week))].sort().reverse();
const entryFor = (w, a) => state.entries.find(e => e.week === w && e.agent.toLowerCase() === a.toLowerCase());
const prevWeekOf = w => { const ws = weeks(), i = ws.indexOf(w); return i >= 0 && i < ws.length - 1 ? ws[i+1] : null; };
const teamTotal = (w, k) => state.entries.filter(e => e.week === w).reduce((s, e) => s + (e[k] || 0), 0);
const isActive = n => (state.agents.find(a => a.name.toLowerCase() === n.toLowerCase()) || {}).active;
function namesForWeek(w){
  const names = state.agents.filter(a => a.active).map(a => a.name);
  state.entries.filter(e => e.week === w).forEach(e => {
    if (!names.some(n => n.toLowerCase() === e.agent.toLowerCase())) names.push(e.agent);
  });
  return names;
}
function allNames(){
  const names = state.agents.map(a => a.name);
  state.entries.forEach(e => { if (!names.some(n => n.toLowerCase() === e.agent.toLowerCase())) names.push(e.agent); });
  return names;
}
function delta(cur, prev){
  if (prev == null) return '';
  const d = cur - prev;
  if (d === 0) return '<span class="delta flat">same as last week</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString()} vs last week</span>`;
}
function deltaShort(cur, prev){
  if (prev == null) return '';
  const d = cur - prev;
  if (d === 0) return '<span class="delta flat">same</span>';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d).toLocaleString()}</span>`;
}
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 3200);
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

/* ===== Tabs ===== */
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  if (view.tab === 'entry' && dirty && b.dataset.tab !== 'entry' &&
      !confirm('You have unsaved numbers. Leave without saving?')) return;
  if (b.dataset.tab !== 'entry') dirty = false;
  view.tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== view.tab);
  render();
}));

/* ===== This week ===== */
function renderThisWeek(){
  const el = $('#thisweek'), ws = weeks();
  if (!ws.length){
    el.innerHTML = `<div class="empty"><h2>No weeks saved yet</h2><p class="sub">Enter this week's numbers to start the tracker.</p><button class="btn" onclick="goTab('entry')">Enter data</button></div>`;
    return;
  }
  if (!view.week || !ws.includes(view.week)) view.week = ws[0];
  const w = view.week, pw = prevWeekOf(w), M = state.metrics;

  const leaders = {};
  M.forEach(m => { leaders[m.key] = Math.max(0, ...state.entries.filter(e => e.week === w).map(e => e[m.key])); });

  const totals = M.map(m => {
    const t = teamTotal(w, m.key);
    return `<div class="total"><div class="lbl">${esc(shortLabel(m))}</div><div class="num">${t.toLocaleString()}</div>${pw ? delta(t, teamTotal(pw, m.key)) : ''}</div>`;
  }).join('');

  const rows = namesForWeek(w).map(n => {
    const e = entryFor(w, n), p = pw ? entryFor(pw, n) : null;
    if (!e) return `<tr><td class="name">${esc(n)}</td><td class="missing" colspan="${M.length}">Not entered for this week</td></tr>`;
    return `<tr><td class="name">${esc(n)}</td>${M.map(m => {
      const lead = leaders[m.key] > 0 && e[m.key] === leaders[m.key];
      return `<td class="${lead ? 'lead' : ''}"><span class="val">${e[m.key].toLocaleString()}</span>${p ? deltaShort(e[m.key], p[m.key]) : ''}</td>`;
    }).join('')}</tr>`;
  }).join('');

  el.innerHTML = `
    <div class="row">
      <div><h2>Week ending ${fmtWeek(w)}</h2><p class="sub" style="margin:0">${weekRange(w)}</p></div>
      <label><span class="sr" hidden>Choose week</span>
        <select id="weekSel" aria-label="Choose week">${ws.map(x => `<option value="${x}" ${x === w ? 'selected' : ''}>Week ending ${fmtWeek(x, true)}</option>`).join('')}</select>
      </label>
    </div>
    <div class="board">
      <div class="board-head"><strong>Team totals</strong><span>${pw ? `Compared with week ending ${fmtWeek(pw, true)}` : 'First week on record'}</span></div>
      <div class="totals">${totals}</div>
    </div>
    <h3>Individual</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Agent</th>${M.map(m => `<th>${esc(shortLabel(m))}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend"><i></i> Top of the team for that metric this week</div>
    <p class="stamp">Developer Team, SIG Austin. Week ending ${fmtWeek(w)}.</p>`;
  $('#weekSel').addEventListener('change', ev => { view.week = ev.target.value; renderThisWeek(); });
}

/* ===== Week over week ===== */
function renderHistory(){
  const el = $('#history'), wsDesc = weeks(), wsAsc = [...wsDesc].reverse(), M = state.metrics;
  if (!wsDesc.length){ el.innerHTML = `<div class="empty"><h2>No history yet</h2><p class="sub">Each week you save shows up here.</p></div>`; return; }
  if (!view.metric || !M.some(m => m.key === view.metric)) view.metric = M[0].key;
  const names = allNames(), who = view.who, team = who === '__team';
  const metric = M.find(m => m.key === view.metric);

  // Summary table: team totals or one agent
  const sumRows = wsDesc.map((w, i) => {
    const pw = wsDesc[i+1] || null;
    if (team){
      return `<tr><td class="name">${fmtWeek(w, true)}</td>${M.map(m => {
        const t = teamTotal(w, m.key);
        return `<td><span class="val">${t.toLocaleString()}</span>${pw ? deltaShort(t, teamTotal(pw, m.key)) : ''}</td>`;
      }).join('')}</tr>`;
    }
    const e = entryFor(w, who), p = pw ? entryFor(pw, who) : null;
    if (!e) return `<tr><td class="name">${fmtWeek(w, true)}</td><td class="missing" colspan="${M.length}">Not entered</td></tr>`;
    return `<tr><td class="name">${fmtWeek(w, true)}</td>${M.map(m =>
      `<td><span class="val">${e[m.key].toLocaleString()}</span>${p ? deltaShort(e[m.key], p[m.key]) : ''}</td>`).join('')}</tr>`;
  }).join('');

  // Matrix: selected metric by agent
  const matrix = team ? `
    <div><h3>${esc(shortLabel(metric))} by agent</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Week ending</th>${names.map(n => `<th>${esc(n)}</th>`).join('')}<th>Team</th></tr></thead>
      <tbody>${wsDesc.map(w => {
        const vals = names.map(n => (entryFor(w, n) || {})[metric.key]);
        const mx = Math.max(0, ...vals.filter(v => v != null));
        return `<tr><td class="name">${fmtWeek(w, true)}</td>${vals.map(v =>
          v == null ? '<td class="missing">–</td>' : `<td class="${mx > 0 && v === mx ? 'lead' : ''}"><span class="val">${v.toLocaleString()}</span></td>`
        ).join('')}<td><span class="val">${teamTotal(w, metric.key).toLocaleString()}</span></td></tr>`;
      }).join('')}</tbody>
    </table></div></div>` : '';

  el.innerHTML = `
    <div class="row">
      <div><h2>Week over week</h2><p class="sub" style="margin:0">${wsDesc.length} week${wsDesc.length > 1 ? 's' : ''} on record</p></div>
      <select id="whoSel" aria-label="Show team or agent">
        <option value="__team" ${team ? 'selected' : ''}>Whole team</option>
        ${names.map(n => `<option value="${esc(n)}" ${n === who ? 'selected' : ''}>${esc(n)}${isActive(n) === false ? ' (inactive)' : ''}</option>`).join('')}
      </select>
    </div>
    <div class="row"><div class="chips" role="group" aria-label="Metric for chart">${M.map(m =>
      `<button class="chip" data-metric="${m.key}" aria-pressed="${m.key === view.metric}">${esc(shortLabel(m))}</button>`).join('')}</div></div>
    <div class="chart-box"><canvas id="histChart" aria-label="${esc(shortLabel(metric))} by week"></canvas></div>
    <div class="stack">
      <div><h3>${team ? 'Team totals by week' : esc(who) + ' by week'}</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>Week ending</th>${M.map(m => `<th>${esc(shortLabel(m))}</th>`).join('')}</tr></thead>
        <tbody>${sumRows}</tbody>
      </table></div></div>
      ${matrix}
    </div>`;

  $('#whoSel').addEventListener('change', ev => { view.who = ev.target.value; renderHistory(); });
  el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { view.metric = c.dataset.metric; renderHistory(); }));
  drawChart(wsAsc, names, team, who, metric);
}

function drawChart(wsAsc, names, team, who, metric){
  if (chart) chart.destroy();
  if (typeof Chart === 'undefined') return;
  const ink = cssVar('--muted'), rule = cssVar('--rule');
  const labels = wsAsc.map(w => fmtWeek(w, true));
  const datasets = team
    ? names.map((n, i) => ({ label: n, data: wsAsc.map(w => (entryFor(w, n) || {})[metric.key] ?? 0),
        backgroundColor: PALETTE[i % PALETTE.length], borderRadius: 3, stack: 's' }))
    : [{ label: who, data: wsAsc.map(w => { const e = entryFor(w, who); return e ? e[metric.key] : null; }),
        borderColor: PALETTE[0], backgroundColor: PALETTE[0], borderWidth: 3, pointRadius: 5, tension: .25, spanGaps: true }];
  chart = new Chart($('#histChart'), {
    type: team ? 'bar' : 'line',
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false, animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 400 },
      plugins: { legend: { display: team, labels: { color: ink, boxWidth: 12 } } },
      scales: {
        x: { stacked: team, ticks: { color: ink }, grid: { display: false } },
        y: { stacked: team, beginAtZero: true, ticks: { color: ink, precision: 0 }, grid: { color: rule } }
      }
    }
  });
}

/* ===== Enter data ===== */
function renderEntry(){
  if (!view.entryWeek) view.entryWeek = fridayOf(dateToIso(new Date()));
  const w = view.entryWeek, M = state.metrics, names = namesForWeek(w);
  const anySaved = names.some(n => entryFor(w, n));

  const rows = names.map(n => {
    const e = entryFor(w, n);
    return `<tr data-agent="${esc(n)}"><td class="name">${esc(n)}</td>${M.map(m =>
      `<td><input type="number" min="0" step="1" inputmode="numeric" data-key="${m.key}" aria-label="${esc(n)} ${esc(m.label)}" value="${e ? e[m.key] : ''}"></td>`).join('')}
      <td class="status">${e ? 'Saved' : 'Not entered'}</td></tr>`;
  }).join('');

  const roster = state.agents.map(a => `<li class="${a.active ? '' : 'off'}"><span>${esc(a.name)}</span>
      <button class="link" data-toggle="${esc(a.name)}" data-active="${a.active}">${a.active ? 'Mark inactive' : 'Reactivate'}</button></li>`).join('');

  $('#entry').innerHTML = `
    <h2>Enter data</h2>
    <p class="sub">Add each agent's numbers for the week, then save. Saving a week again updates it without touching other weeks.</p>
    <div class="entry-grid">
      <div>
        <div class="week-pick">
          <label for="weekInput">Week ending</label>
          <input type="date" id="weekInput" value="${w}">
          <span class="week-note">${fmtWeek(w)}, covering ${weekRange(w)}${anySaved ? '. Already has saved numbers.' : ''}</span>
        </div>
        <div class="table-wrap entry" style="margin-top:14px"><table id="entryTable">
          <thead><tr><th>Agent</th>${M.map(m => `<th>${esc(m.label)}</th>`).join('')}<th>Status</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="${M.length + 2}" class="missing">Add an agent to start entering numbers.</td></tr>`}</tbody>
        </table></div>
        <div class="actions">
          <button class="btn" id="saveBtn">Save week</button>
          <span class="dirty" id="dirtyNote" hidden>Unsaved changes</span>
        </div>
      </div>
      <aside class="panel">
        <h3>Team roster</h3>
        <div class="add-row">
          <input type="text" id="newAgent" placeholder="New agent's name" aria-label="New agent's name">
          <button class="btn" id="addBtn">Add agent</button>
        </div>
        <ul class="roster">${roster}</ul>
        <p class="sub" style="margin:12px 0 0;font-size:13px">Inactive agents drop off This week and Enter data. Their past weeks stay in the history.</p>
      </aside>
    </div>`;

  $('#weekInput').addEventListener('change', ev => {
    if (!ev.target.value) return;
    if (dirty && !confirm('Switch weeks without saving your changes?')) { ev.target.value = w; return; }
    view.entryWeek = fridayOf(ev.target.value); dirty = false; renderEntry();
  });
  $('#entryTable').addEventListener('input', () => { dirty = true; $('#dirtyNote').hidden = false; });
  $('#saveBtn').addEventListener('click', saveWeek);
  $('#addBtn').addEventListener('click', addAgent);
  $('#newAgent').addEventListener('keydown', ev => { if (ev.key === 'Enter') addAgent(); });
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    const active = b.dataset.active !== 'true';
    post({ action: 'setAgentActive', name: b.dataset.toggle, active },
      `${b.dataset.toggle} ${active ? 'reactivated' : 'marked inactive'}`);
  }));
}

async function saveWeek(){
  const entries = [];
  document.querySelectorAll('#entryTable tbody tr[data-agent]').forEach(tr => {
    const inputs = [...tr.querySelectorAll('input')];
    if (inputs.every(i => i.value === '')) return;
    const o = { agent: tr.dataset.agent };
    inputs.forEach(i => o[i.dataset.key] = Math.max(0, Math.round(Number(i.value) || 0)));
    entries.push(o);
  });
  if (!entries.length) return toast('Enter at least one agent\'s numbers before saving', true);
  const ok = await post({ action: 'saveWeek', week: view.entryWeek, entries }, `Saved week ending ${fmtWeek(view.entryWeek, true)}`);
  if (ok) view.week = view.entryWeek;
}

function addAgent(){
  const name = $('#newAgent').value.trim();
  if (!name) return toast('Type a name to add an agent', true);
  post({ action: 'addAgent', name }, `Added ${name}`);
}

/* ===== Sheet connection ===== */
function getPass(){
  let p = null;
  try { p = localStorage.getItem('dtt-pass'); } catch (e) {}
  if (!p){
    p = prompt('Enter the tracker passcode to save');
    if (p) { try { localStorage.setItem('dtt-pass', p); } catch (e) {} }
  }
  return p;
}
function forgetPass(){ try { localStorage.removeItem('dtt-pass'); } catch (e) {} }

async function post(payload, okMsg){
  if (DEMO){ demoApply(payload); dirty = false; render(); toast(okMsg); return true; }
  const pass = getPass(); if (!pass) return false;
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...payload, passcode: pass }) });
    const j = await r.json();
    if (!j.ok){
      if (j.error === 'Wrong passcode'){ forgetPass(); toast('Wrong passcode. Try saving again.', true); }
      else toast(j.error, true);
      return false;
    }
    state = j.data; dirty = false; render(); toast(okMsg); return true;
  } catch (e) {
    toast('The sheet did not respond. Check your connection and save again.', true); return false;
  } finally {
    document.querySelectorAll('.btn').forEach(b => b.disabled = false);
  }
}

async function load(){
  if (DEMO){ $('#demoBar').hidden = false; state = demoData(); render(); return; }
  try {
    const r = await fetch(API_URL); const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    state = j.data; render();
  } catch (e) {
    $('#thisweek').innerHTML = `<div class="empty"><h2>The tracker could not load</h2><p class="sub">Check that the Apps Script is deployed with access set to Anyone, then refresh.</p></div>`;
  }
}

function render(){
  if (view.tab === 'thisweek') renderThisWeek();
  if (view.tab === 'history') renderHistory();
  if (view.tab === 'entry') renderEntry();
}
function goTab(t){ document.querySelector(`nav button[data-tab="${t}"]`).click(); }
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ===== Demo data (used only when API_URL is blank) ===== */
function demoData(){
  const metrics = [
    { key:'listings', label:'# of Listings', short:'Listings' },
    { key:'calls', label:'Placed Dialpad Calls', short:'Dialpad Calls' },
    { key:'contacts', label:'# of Contacts', short:'Contacts' },
    { key:'offers', label:'# of Offers on Listings', short:'Offers' }];
  const agents = ['Dave','Cayson','Maxwell','Jordan'].map(name => ({ name, active: true }));
  const entries = [], last = fridayOf(dateToIso(new Date()));
  let seed = 7; const rnd = (a, b) => { seed = (seed * 9301 + 49297) % 233280; return a + Math.floor(seed / 233280 * (b - a + 1)); };
  for (let i = 5; i >= 1; i--){
    const d = isoToDate(last); d.setDate(d.getDate() - 7 * i); const week = dateToIso(d);
    agents.forEach(a => entries.push({ week, agent: a.name, listings: rnd(0, 4), calls: rnd(60, 180), contacts: rnd(15, 55), offers: rnd(0, 6) }));
  }
  return { metrics, agents, entries };
}
function demoApply(p){
  if (p.action === 'saveWeek'){
    p.entries.forEach(en => {
      const ex = entryFor(p.week, en.agent);
      if (ex) Object.assign(ex, en, { week: p.week }); else state.entries.push({ ...en, week: p.week });
    });
  } else if (p.action === 'addAgent'){
    const a = state.agents.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if (a) a.active = true; else state.agents.push({ name: p.name, active: true });
  } else if (p.action === 'setAgentActive'){
    const a = state.agents.find(x => x.name === p.name); if (a) a.active = p.active;
  }
}

load();
</script>
